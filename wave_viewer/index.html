<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wave Viewer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Waveform Viewer</h1>
        <div class="chart-container">
            <canvas id="waveChart"></canvas>
        </div>
        <div class="controls">
            <button id="start-sampling">Start Sampling</button>
            <button id="stop-sampling">Stop Sampling</button>
        </div>
        <div class="settings">
            <div class="setting-item">
                <label for="sec-input">Data Seconds:</label>
                <input type="number" id="sec-input" value="1" min="1">
                <button id="change-sec">Change</button>
            </div>
            <div class="setting-item">
                <label for="ch-input">Channel:</label>
                <input type="number" id="ch-input" value="1" min="1">
                <button id="change-ch">Change</button>
            </div>
        </div>
        <div class="info-panel">
            <h2>Information</h2>
            <div class="info-grid">
                <div class="info-item">
                    <span class="info-label">Status:</span>
                    <span id="status-light" class="light connecting"></span>
                    <span id="status-text">Connecting...</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Max:</span>
                    <span id="max-value">-</span> V
                </div>
                <div class="info-item">
                    <span class="info-label">Min:</span>
                    <span id="min-value">-</span> V
                </div>
                <div class="info-item">
                    <span class="info-label">Average:</span>
                    <span id="ave-value">-</span> V
                </div>
                <div class="info-item">
                    <span class="info-label">RMS:</span>
                    <span id="rms-value">-</span> V
                </div>
                 <div class="info-item">
                    <span class="info-label">Pulse:</span>
                    <span id="pulse-value">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Terminal Voltage:</span>
                    <span id="terminal-vol-value">-</span> V
                </div>
                <div class="info-item">
                    <span class="info-label">Datetime:</span>
                    <span id="datetime-value">-</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Chart.jsライブラリ本体 (ローカルにダウンロードして配置) -->
    <script src="js/chart.js"></script>
    <!-- アプリケーションのメインスクリプト -->
    <script src="js/main.js"></script>
</body>
</html>
