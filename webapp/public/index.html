<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQTT Web App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Real-time Data Viewer</h1>

    <div class="container">
        <div class="section">
            <h2>Live Data (TestResult)</h2>
            <div id="data-display" class="display-box">
                <p>Waiting for data...</p>
            </div>
        </div>

        <div class="section">
            <h2>Settings</h2>
            <div id="settings-display" class="display-box">
                <h3>Current Thresholds</h3>
                <ul id="thresholds-list">
                    <li>Threshold 1: <span>N/A</span></li>
                    <li>Threshold 2: <span>N/A</span></li>
                    <li>Threshold 3: <span>N/A</span></li>
                </ul>
            </div>
            <div id="settings-control">
                <h3>Update Threshold</h3>
                <form id="update-form">
                    <label for="threshold-id">Threshold Number:</label>
                    <select id="threshold-id" name="id">
                        <option value="1">Threshold 1</option>
                        <option value="2">Threshold 2</option>
                        <option value="3">Threshold 3</option>
                    </select>
                    <label for="threshold-value">New Value:</label>
                    <input type="number" id="threshold-value" name="value" step="0.01" required>
                    <button type="submit">Update</button>
                </form>
                <p id="update-status"></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
